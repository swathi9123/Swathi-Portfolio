<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Developer Skills</title>
  <style>
    /* Background with moving stars */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      /*background: linear-gradient(135deg, #6a11cb, #2575fc);*/
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Star background animation */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      pointer-events: none;
      background: url('https://www.transparenttextures.com/patterns/starburst.png') repeat;
      animation: star-animation 50s linear infinite;
    }

    @keyframes star-animation {
      0% { background-position: 0 0; }
      100% { background-position: 500px 500px; }
    }

    /* Title */
    h1 {
      margin-bottom: 40px;
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff;
    }

    /* Container */
    .skills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    /* Skill Card */
    .skill-card {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 15px;
      padding: 20px;
      width: 200px;
      box-shadow: 0 0 15px #000;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .skill-card h2 {
      margin-bottom: 20px;
      font-size: 1.2rem;
      border-bottom: 1px solid #666;
      padding-bottom: 5px;
    }

    /* Skill Item */
    .skill {
      margin-bottom: 20px;
      position: relative;
    }

    .circle {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      border-radius: 50%;
      background: conic-gradient(#00f0ff 0%, #ccc 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      color: #fff;
      transition: all 0.4s ease;
    }

    .skill p {
      margin-top: 10px;
      font-size: 1rem;
    }

    /* Neon Glow on Hover */
    .skill-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 0 15px 5px #00f0ff;
    }

    .skill-card:hover .circle {
      box-shadow: 0 0 20px 5px #00f0ff;
    }

  </style>
</head>

<body>

  <div class="stars"></div> <!-- Moving stars background -->

  <h1>My Developer Skills</h1>

  <div class="skills-container">
    <!-- Frontend -->
    <div class="skill-card">
      <h2>Frontend</h2>
      <div class="skill">
        <div class="circle" data-percent="95">0%</div>
        <p>HTML</p>
      </div>
      <div class="skill">
        <div class="circle" data-percent="90">0%</div>
        <p>CSS</p>
      </div>
      <div class="skill">
        <div class="circle" data-percent="92">0%</div>
        <p>JavaScript</p>
      </div>
    </div>

    <!-- Backend -->
    <div class="skill-card">
      <h2>Backend</h2>
      <div class="skill">
        <div class="circle" data-percent="85">0%</div>
        <p>Node.js</p>
      </div>
      <div class="skill">
        <div class="circle" data-percent="75">0%</div>
        <p>SQL</p>
      </div>
    </div>

    <!-- Platforms -->
    <div class="skill-card">
      <h2>Platforms & Tools</h2>
      <div class="skill">
        <div class="circle" data-percent="90">0%</div>
        <p>Git</p>
      </div>
      <div class="skill">
        <div class="circle" data-percent="95">0%</div>
        <p>VS Code</p>
      </div>
    </div>

    <!-- Soft Skills -->
    <div class="skill-card">
      <h2>Soft Skills</h2>
      <div class="skill">
        <div class="circle" data-percent="90">0%</div>
        <p>Communication</p>
      </div>
      <div class="skill">
        <div class="circle" data-percent="88">0%</div>
        <p>Teamwork</p>
      </div>
      <div class="skill">
        <div class="circle" data-percent="85">0%</div>
        <p>Problem Solving</p>
      </div>
    </div>
  </div>

  <script>
    // Animate circles
    document.querySelectorAll('.circle').forEach(circle => {
      let percent = circle.getAttribute('data-percent');
      let current = 0;
      let interval = setInterval(() => {
        if (current >= percent) {
          clearInterval(interval);
        } else {
          current++;
          circle.innerText = current + "%";
          circle.style.background = `conic-gradient(#00f0ff ${current * 3.6}deg, #ccc ${current * 3.6}deg)`;
        }
      }, 20);
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-top: 50px;
    }

    h1 {
      font-size: 3em;
      color: #0ff;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px #0ff;
    }

    .achievement-container {
      width: 80%;
      max-width: 800px;
      margin-top: 40px;
    }

    .achievement {
      background: rgba(255, 255, 255, 0.05);
      border-left: 5px solid #0ff;
      margin: 20px 0;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px #0ff, 0 0 20px #0ff inset;
      transition: transform 0.3s ease;
    }

    .achievement:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px #0ff, 0 0 30px #0ff inset;
    }

    button {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 1rem;
      background: black;
      color: #0ff;
      border: 2px solid #0ff;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s ease;
      text-shadow: 0 0 5px #0ff;
    }

    button:hover {
      background: #0ff;
      color: black;
      box-shadow: 0 0 20px #0ff;
    }
  </style>
</head>
<body>
  <h1>🏆 My Achievements</h1>
  <div class="achievement-container" id="achievementList">
    <div class="achievement">🎓 Graduated with honors in Computer Application</div>
    <div class="achievement">🏅 I won second place in proficiency for 12th grade.</div> 
    <div class="achievement">🏅 I won second place in English word align arrangement in final year of bachelor degree.</div>
    <div class="achievement">📜 Published a  paper on AI for AI for edge computing</div>
  </div>
  <button onclick="addAchievement()">Add Random Achievement</button>

  <script>
    const achievements = [
      "🚀 Launched my own app on Play Store",
      "💼 Got my first developer job",
      "🎤 Spoke at a tech conference",
      "🎯 Completed 100+ coding challenges",
      "🧠 Learned a new programming language"
    ];

    function addAchievement() {
      const container = document.getElementById("achievementList");
      const div = document.createElement("div");
      div.className = "achievement";
      const random = achievements[Math.floor(Math.random() * achievements.length)];
      div.textContent = random;
      container.appendChild(div);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Neon Portfolio</title>
  <style>
    body {
      background-color: #0a0a0a;
      font-family: 'Arial', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 450px;
      text-align: center;
    }

    .neon-title {
      font-size: 2.5em;
      color: #0ff;
      text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff;
      margin-bottom: 30px;
    }

    form input, form textarea {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      outline: none;
      background: #111;
      color: #0ff;
      font-size: 1em;
      border-radius: 5px;
      box-shadow: 0 0 5px #0ff, 0 0 10px #0ff inset;
      transition: 0.3s;
    }

    form input:focus, form textarea:focus {
      box-shadow: 0 0 10px #0ff, 0 0 20px #0ff inset;
    }

    form button {
      margin-top: 15px;
      padding: 12px 20px;
      background: #000;
      color: #0ff;
      border: 2px solid #0ff;
      cursor: pointer;
      font-size: 1em;
      border-radius: 5px;
      box-shadow: 0 0 5px #0ff;
      transition: 0.3s;
    }

    form button:hover {
      background-color: #0ff;
      color: #000;
      box-shadow: 0 0 20px #0ff;
    }

    .success-message {
      color: lime;
      margin-top: 15px;
      display: none;
    }

    .error-message {
      color: red;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="neon-title">Contact Me</h1>
    <form action="https://api.web3forms.com/submit" method="POST" id="contact-form">
      <input type="hidden" name="access_key" value="77df1cf1-68ec-496c-afa9-7d3e30f08b90">

      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>

      <button type="submit">Send Message</button>

      <p class="success-message" id="success-msg">✅ Message sent successfully!</p>
      <p class="error-message" id="error-msg">❌ Something went wrong. Please try again.</p>
    </form>
  </div>

  <script>
    const form = document.getElementById("contact-form");
    const successMsg = document.getElementById("success-msg");
    const errorMsg = document.getElementById("error-msg");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(form);

      fetch(form.action, {
        method: form.method,
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          successMsg.style.display = "block";
          errorMsg.style.display = "none";
          form.reset();
        } else {
          response.json().then(data => {
            errorMsg.textContent = data.message || "❌ Submission failed.";
            errorMsg.style.display = "block";
            successMsg.style.display = "none";
          });
        }
      }).catch(() => {
        errorMsg.textContent = "❌ Network error.";
        errorMsg.style.display = "block";
        successMsg.style.display = "none";
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificates</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color:black;
      color: #0ff;
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px 20px;
    }

    h1 {
      font-size: 2.5rem;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      margin-bottom: 40px;
    }

    .cert-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .cert-box {
      width: 300px;
      padding: 20px;
      border: 3px solid #0ff;
      border-radius: 15px;
      text-decoration: none;
      color: #0ff;
      font-size: 1.5rem;
      box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      transition: all 0.3s ease;
    }

    .cert-box:hover {
      background-color: #0ff;
      color: black;
      box-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
    }
  </style>
</head>
<body>

  <h1>My Certificates</h1>

  <div class="cert-container">
    <a href="cloud infrastructure certificate.jpeg "class="cert-box">Oracle Certificate</a>
    <a href="mongodb(certificate).jpeg" class="cert-box">MongoDB Certificate</a>
    <a href="paper.jpeg" class="cert-box">Paper Publish Certificate</a>
  </div>

</body>
</html>
